# Dependabot revisa las dependencias una vez por semana y abre PRs para actualizarlas. Además, con las
# "security updates" activadas en el repo, abre un PR apenas aparece una vulnerabilidad conocida.
version: 2
updates:
  - package-ecosystem: npm          # pnpm usa el ecosistema npm; lee pnpm-lock.yaml de la raíz
    directory: /
    schedule:
      interval: weekly
    cooldown:                       # sólo versiones con al menos 14 días publicadas (no aplica a
      default-days: 14              # los arreglos de seguridad, que llegan apenas salen)
    groups:                         # un PR por semana con todo lo menor, en vez de uno por paquete
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node acompañan al runtime (Node 24, web/.nvmrc): su versión mayor no se sube sola.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions   # también las versiones de las acciones de los workflows
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
